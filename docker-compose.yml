version: '3.8'

services:
  backend:
    build: .
    container_name: lyzr-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    # Placeholder for frontend service
    # To be implemented with Next.js
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lyzr-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
